<script>try{if(localStorage.getItem("td_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
  /* ---- Your pay: a month at a time, one card per centre ---- */
  .mp-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
  .mp-nav b{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.02em;text-align:center;flex:1}
  .mp-step{all:unset;box-sizing:border-box;cursor:pointer;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);display:grid;place-items:center}
  .mp-step:hover{background:#FBFAF7}
  .mp-step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mp-step[disabled]{opacity:.4;cursor:default}
  .mp-card{padding:16px;margin:0 0 14px}
  .mp-org{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
  .mp-total{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
  .mp-period{font-size:13px;color:var(--muted);margin:2px 0 10px}
  .mp-est{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#F1EFEA;color:var(--muted)}
  .mp-est.final{background:rgba(15,118,110,.12);color:var(--teal)}
  .mp-lines{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
  .mp-lines li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink)}
  .mp-lines li span:first-child{min-width:0;overflow-wrap:anywhere}
  .mp-lines li span:last-child{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
  .mp-lines li.total{font-weight:800;border-bottom:none}
  .mp-lines li.deduction span:last-child{color:var(--owed)}
  .mp-pend{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:rgba(180,83,9,.10);color:#9A4A07;font-size:13.5px;font-weight:600}
  .mp-sub{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
  .mp-les{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .mp-les:last-child{border-bottom:none}
  .mp-les .d{flex:0 0 58px;color:var(--muted);font-size:12.5px;font-weight:700}
  .mp-les .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:600}
  .mp-les .a{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
  .mp-les .a.pending{color:#9A4A07;font-weight:700}
  .mp-empty{padding:22px 16px;color:var(--muted);font-size:14px}
  .mp-foot{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
</style>
<link rel="stylesheet" href="assets/css/dark.css?v=357">
</head>
<body>
<div id="view" data-page="mypay">
  <div class="mp-nav" id="mp-nav" style="display:none">
    <button class="mp-step" id="mp-prev" type="button" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <b id="mp-label" aria-live="polite"></b>
    <button class="mp-step" id="mp-next" type="button" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div id="mp-body" aria-live="polite"><div class="card mp-card"><div class="mp-empty">Loading your pay…</div></div></div>
</div>
