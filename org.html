<style>
  .og-wrap{max-width:820px;display:flex;flex-direction:column;gap:14px}
  .og-card{padding:20px 22px;border-radius:16px}
  .og-card h2{font-size:17px;font-weight:800;margin:0 0 2px}
  .og-card h3{font-size:14.5px;font-weight:800;margin:18px 0 8px}
  .og-sub{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.5}
  .og-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:600px){.og-row{grid-template-columns:1fr;gap:0}}
  .og-steps{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
  .og-steps::-webkit-scrollbar{display:none}
  .og-steps button{all:unset;cursor:pointer;white-space:nowrap;padding:10px 12px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent}
  .og-steps button.on{color:var(--ink);border-bottom-color:var(--accent)}
  .og-steps button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:10px;font-size:11.5px;margin-right:6px;background:var(--bg);color:var(--muted)}
  .og-steps button.done .n{background:var(--accent-soft);color:var(--accent)}
  .og-steps button.on .n{background:var(--accent);color:#fff}
  .og-check{display:flex;align-items:flex-start;gap:9px;font-size:14px;margin:2px 0 14px;cursor:pointer;line-height:1.4}
  .og-check input{width:18px;height:18px;margin-top:1px;accent-color:var(--accent);flex:none}
  .og-soon{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--muted);margin-left:6px;vertical-align:1px}
  .og-off{opacity:.55}
  /* notes that say "Coming soon": dimmed with the muted colour, not opacity (opacity gave 2.3:1 contrast, needs 4.5:1) */
  .og-note.og-off{opacity:1;color:var(--muted)}
  .og-note.og-off b{color:var(--ink)}
  .og-help{display:block;font-size:12.5px;color:var(--muted);margin:-8px 0 14px;line-height:1.45}
  .og-note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:0 0 14px;line-height:1.5}
  .og-nav{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;gap:10px;margin-top:6px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(19,35,63,.08)}
  .og-nav .msg{margin:0;flex:1;min-height:0;font-size:13px}
  @media(max-width:820px){.og-card{padding:18px 16px}.og-nav{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
  .og-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .og-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
  .og-item .grow{flex:1;min-width:0}
  .og-item .meta{font-size:12.5px;color:var(--muted)}
  .og-hol{margin:0 0 14px}
  .og-hol-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .og-hol-btns{display:flex;gap:8px;flex-wrap:wrap}
  .og-hol-btns .btn{height:34px;padding:0 12px}
  .og-hol-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
  @media(max-width:600px){.og-hol-list{grid-template-columns:1fr}}
  .og-hol-row{margin:0;padding:6px 0;align-items:flex-start}
  .og-hol-name{font-weight:600}
  .og-hol-meta{display:block}
  .og-x{all:unset;cursor:pointer;color:var(--muted);font-size:18px;padding:2px 8px;border-radius:6px}
  .og-x:hover{background:rgba(180,67,47,.08);color:var(--owed)}
  .og-badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .og-badge.grey{background:var(--bg);color:var(--muted)}
  .og-perms{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 2px}
  .og-perms label{display:flex;align-items:center;gap:6px;font-size:13px}
  .og-perms input{accent-color:var(--accent)}
  .og-sum{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:6px}
  .og-sum td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .og-sum td:first-child{color:var(--muted);width:48%;padding-right:12px}
  .og-sum-h{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px}
  .og-sum-h h3{margin:0}
  .og-link{all:unset;cursor:pointer;color:var(--accent);font-weight:700;font-size:13px}
  .og-doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;color:#13233F;font-size:13px}
  .og-doc .bar{height:6px}
  .og-doc .in{padding:16px 18px}
  .og-doc h4{margin:0;font-size:17px;font-weight:800}
  .og-doc table{width:100%;border-collapse:collapse;margin:10px 0}
  .og-doc td{padding:5px 0;border-bottom:1px solid #EEE}
  .og-doc td:last-child{text-align:right;white-space:nowrap}
  .og-doc .tot td{font-weight:800;border-bottom:0}
  .og-doc .small{color:#5E6676;font-size:12px}
  .og-audit td{font-size:13px;vertical-align:top;padding:7px 8px 7px 0;border-bottom:1px solid var(--line)}
  .og-audit .when{white-space:nowrap;color:var(--muted)}
  .og-empty{text-align:center;padding:28px 16px}
</style>
