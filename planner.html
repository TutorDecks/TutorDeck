<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Planner · TutorDeck</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/app.css?v=236">
<style>
  /* make the lesson time the visual anchor of each slot */
  .slot{padding-top:9px}
  .slot .t{color:var(--navy);font-weight:800;font-size:15px;letter-spacing:.01em;line-height:1.15}
  .slot .subj{color:var(--gold);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
  .slot .s{font-weight:600;font-size:13px;margin:3px 0 0;color:var(--ink)}
  .slot .c{color:var(--teal);font-weight:700;font-size:12.5px;margin-top:2px}
  /* split lessons: one shared time header, students stacked full-width below —
     legible at any column width, unlike squeezing two cards side by side */
  .slot-group>.t{cursor:default;margin-bottom:2px}
  .slot-group .sg-item{position:relative;padding:6px 24px 6px 0;border-top:1px dashed var(--line)}
  .slot-group .sg-item:first-of-type{border-top:none;padding-top:0}
  .slot-group .sg-item .x{top:4px;right:0}
  /* two different students genuinely double-booked (not an intentional split,
     not the same household) — flag it like the Calendar's clash warning */
  .slot.clash,.sg-item.clash{outline:2px solid var(--owed);outline-offset:-2px}
  .slot.clash{border-color:var(--owed)}
  .clash-badge{color:var(--owed);font-weight:900;margin-left:4px}

  /* ---- v176 redesign ---- */
  .toolbar{align-items:center;margin-bottom:16px}
  .week-tot{font-family:var(--sans);font-size:14px;color:var(--muted);display:flex;align-items:baseline;gap:8px}
  .week-tot .wt-k{font-weight:600}
  .week-tot b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .pl-add{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:10px}
  .week{gap:10px}
  .day{border-radius:14px;box-shadow:none}
  .day > h3{background:transparent;color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:800;padding:12px 12px 6px;border-bottom:none}
  .day > h3 .dtot,.day > h3.has .dtot{color:var(--muted);font-weight:600;font-size:12px}
  .day .slots{padding:4px 8px 10px;gap:6px}
  .day.dempty{background:transparent;border-style:dashed}
  .day.dempty .slots{display:none}
  .slot{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:9px 10px;box-shadow:none;background:#fff}
  .slot:hover{border-color:#D6D2C8;border-left-color:var(--accent)}
  .slot .t{font-size:14px}
  .slot .subj{color:var(--muted);text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;margin-top:1px}
  .slot .s{font-size:14px;font-weight:700;margin-top:4px}
  .slot .c{color:var(--muted);font-weight:600;font-size:12.5px;margin-top:1px}
  .slot-group .sg-item{padding-right:0}
  .pl-remove{margin-right:auto;color:var(--owed);border-color:transparent;background:transparent;padding-left:0}
  .pl-remove:hover{background:transparent;text-decoration:underline}
  @media(max-width:820px){
    .week{grid-template-columns:1fr}
    .day > h3{padding:12px 14px 6px}
    .day .slots{padding:2px 10px 10px}
    .day.dempty > h3{padding:10px 14px}
    .slot{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"t s c" "t subj c";column-gap:14px;align-items:center;padding:11px 12px}
    .slot .t{grid-area:t;font-size:14px;align-self:center}
    .slot .s{grid-area:s;margin:0}
    .slot .subj{grid-area:subj;margin:0}
    .slot .c{grid-area:c;margin:0;font-size:13.5px;color:var(--ink);font-weight:700}
    .slot-group{display:block}
  }
</style>
</head>
<body>
<div id="view">
  <div class="toolbar">
    <div class="sub week-tot" id="p-total" data-sk>Loading your schedule…</div>
    <button class="btn btn-gold pl-add" id="add-btn" data-fab="Add slot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add slot</button>
  </div>

  <div class="week" id="week"><div class="sk-rows" aria-hidden="true"><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1"></span><span class="sk sk-l2"></span></span></div><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1 w2"></span><span class="sk sk-l2"></span></span></div><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1"></span><span class="sk sk-l2"></span></span></div></div></div>

  <div class="modal-backdrop" id="modal">
    <div class="modal card">
      <h2 id="m-title">Add weekly slot</h2>
      <div class="field">
        <label for="m-student">Student</label>
        <select id="m-student" data-req></select>
      </div>
      <div class="field">
        <label for="m-day">Day</label>
        <select id="m-day">
          <option value="0">Monday</option>
          <option value="1">Tuesday</option>
          <option value="2">Wednesday</option>
          <option value="3">Thursday</option>
          <option value="4">Friday</option>
          <option value="5">Saturday</option>
          <option value="6">Sunday</option>
        </select>
      </div>
      <div class="row2">
        <div class="field">
          <label for="m-start">Start</label>
          <input id="m-start" data-req type="time">
        </div>
        <div class="field">
          <label for="m-end">End</label>
          <input id="m-end" data-req type="time">
        </div>
      </div>
      <div class="field">
        <label for="m-rate">Rate per hour (S$)</label>
        <input id="m-rate" data-req type="number" min="0" step="0.5" placeholder="e.g. 50">
        <span class="fhint fprice" id="m-price"></span>
      </div>
      <div class="field">
        <label for="m-subject">Subject <span class="opt">Optional</span></label>
        <input id="m-subject" list="dl-subject" type="text" placeholder="e.g. A-Math"><datalist id="dl-subject"></datalist>
      </div>
      <details class="more-fields">
        <summary>More details <small>Subject level, group lessons</small></summary>
        <div class="more-body">
          <div class="field">
            <label for="m-level">Subject level <span class="opt">Optional</span></label>
            <input id="m-level" type="text" list="dl-sublevel" placeholder="e.g. G3" data-autofill><datalist id="dl-sublevel"><option value="G1"><option value="G2"><option value="G3"><option value="HL"><option value="SL"></datalist>
            <span class="fhint">G1, G2 or G3 for this subject (or HL / SL). Shown next to the subject on invoices.</span>
          </div>
          <div class="field">
            <label for="m-split">Split between <span class="opt">Optional</span></label>
            <input id="m-split" type="number" min="1" step="1" value="1">
            <span class="fhint">For group lessons: the hourly rate is shared by this many students. Leave at 1 for one-to-one.</span>
          </div>
          <p class="muted" id="m-splithint" style="font-size:12.5px;margin:-4px 0 8px"></p>
        </div>
      </details>
      <div class="msg" id="m-msg"></div>
      <div class="modal-actions">
        <button class="btn pl-remove" id="m-remove" style="display:none">Remove slot</button>
        <button class="btn" id="m-cancel">Cancel</button>
        <button class="btn btn-gold" id="m-save">Save slot</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=236"></script>
<script src="assets/js/supabase.js?v=236"></script>
<script src="assets/js/app.js?v=236"></script>
<script src="assets/js/planner.js?v=236"></script>
</body>
</html>
