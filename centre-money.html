<head>

<style>
  .cm-wrap{max-width:820px;display:flex;flex-direction:column;gap:14px}
  .cm-nav{display:flex;align-items:center;gap:8px}
  .cm-nav .btn{min-height:42px;padding:0 14px}
  .cm-when{flex:1;min-width:0;text-align:center;font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.01em}
  .cm-ctx{font-size:13px;color:var(--muted);text-align:center;margin-top:-6px}
  .cm-msg{min-height:0;font-size:14px;line-height:1.45;font-weight:600}
  .cm-msg.ok{padding:10px 14px;border-radius:12px;background:rgba(15,118,110,.1);color:var(--accent-ink)}
  .cm-msg.err{padding:10px 14px;border-radius:12px;background:rgba(180,67,47,.1);color:var(--owed)}
  .cm-sum{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
  .cm-sum-t{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .cm-sum-s{font-size:14px;color:var(--muted)}
  .cm-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .cm-acts .btn{min-height:46px}
  .cm-acts.col{flex-direction:column;margin-top:18px}
  .cm-acts.col .btn{width:100%;justify-content:center}
  .cm-sec{display:flex;flex-direction:column}
  .cm-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:6px 2px 8px;display:flex;gap:8px;align-items:baseline}
  .cm-n{font-weight:700;letter-spacing:0;color:var(--muted)}
  .cm-h2{font-size:17px;font-weight:800;margin:0 0 6px}
  .cm-note{font-size:13.5px;color:var(--muted);margin:0 2px 8px;line-height:1.5}
  .cm-note.err{color:var(--owed)}
  .cm-list{display:flex;flex-direction:column;padding:0;overflow:hidden;margin:0}
  .cm-row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-top:1px solid var(--line);min-height:56px}
  button.cm-row{cursor:pointer}
  .cm-row:first-child{border-top:none}
  button.cm-row:hover{background:#FBFAF7}
  .cm-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .cm-row.held{border-left:4px solid var(--warn);background:rgba(180,83,9,.05)}
  .cm-row.off .cm-name{text-decoration:line-through;color:var(--muted)}
  .cm-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .cm-name{font-size:15px;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
  .cm-no{font-weight:800;color:var(--accent-ink)}
  .cm-sub{font-size:12.5px;color:var(--muted)}
  .cm-sub.warn{color:var(--warn);font-weight:700}
  .cm-amt{flex:none;font-weight:800;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
  .cm-act{flex:none;min-height:40px}
  .cm-chip{flex:none;display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#F1EFEA;color:var(--muted);white-space:nowrap}
  .cm-chip.ok{background:rgba(15,118,110,.12);color:var(--accent-ink)}
  .cm-chev{flex:none;color:#B9BDC6}
  .cm-foot{font-size:13px;color:var(--muted);margin:2px 2px 0}
  .cm-link{all:unset;cursor:pointer;color:var(--accent-ink);font-weight:700;text-decoration:underline;padding:4px}
  .cm-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cm-block{padding:26px 20px}
  .cm-block .btn{margin-top:6px}
  /* ---- the invoice sheet ---- */
  .owe-sheet{position:fixed;inset:0;z-index:70;background:rgba(19,35,63,.38);display:flex;justify-content:flex-end;
    opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
  .owe-sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
  .owe-panel{background:var(--bg);width:min(480px,100%);height:100%;display:flex;flex-direction:column;
    box-shadow:-12px 0 40px rgba(19,35,63,.18);transform:translateX(24px);transition:transform .22s ease}
  .owe-sheet.on .owe-panel{transform:none}
  .owe-grab{display:none}
  .owe-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line);background:#fff}
  .owe-hl{flex:1;min-width:0}
  .owe-title{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .owe-meta{font-size:13px;color:var(--muted)}
  .owe-x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
  .owe-x:hover{background:#F1EFEA;color:var(--ink)}
  .owe-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .owe-body{flex:1;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  body.sheet-lock{overflow:hidden}
  @media(max-width:820px){
    .owe-sheet{align-items:flex-end;justify-content:stretch}
    .owe-panel{width:100%;height:auto;max-height:88vh;max-height:88dvh;border-radius:20px 20px 0 0;transform:translateY(30px);box-shadow:0 -10px 40px rgba(19,35,63,.2)}
    .owe-grab{display:block;width:38px;height:4px;border-radius:2px;background:#D6D2C9;margin:8px auto 0}
    .owe-head{border-radius:20px 20px 0 0;padding:10px 18px 12px}
    .cm-row.held{flex-wrap:wrap}
    .cm-row.held .cm-act{width:100%;justify-content:center}
  }
  .cm-g{margin:0 0 14px}
  .cm-gh{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .cm-ln{display:flex;gap:12px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .cm-ln:first-of-type{border-top:none}
  .cm-ld{min-width:0;overflow-wrap:anywhere}
  .cm-la{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
  .cm-la.neg{color:var(--accent-ink)}
  .cm-tot{border-top:2px solid var(--line);margin-top:6px;padding-top:8px;display:flex;flex-direction:column;gap:4px;font-size:14px}
  .cm-tot div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
  .cm-tot .big{font-weight:800;font-size:16px;color:var(--ink)}
  .cm-facts{display:flex;flex-direction:column;gap:6px;margin:14px 0 6px;font-size:14px}
  .cm-facts div{display:flex;gap:10px}
  .cm-facts span:first-child{flex:0 0 70px;color:var(--muted)}
  /* ---- tabs, filters, forms (S3: invoices and payments) ---- */
  .cm-panel{display:flex;flex-direction:column;gap:14px}
  .cm-panel[hidden]{display:none}
  .cm-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
  .cm-tab{all:unset;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;min-height:20px}
  .cm-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
  .cm-tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .cm-chip.warn{background:rgba(180,83,9,.12);color:var(--warn)}
  .cm-chip.bad{background:rgba(180,67,47,.12);color:var(--owed)}
  .cm-filters{display:flex;gap:8px;flex-wrap:wrap}
  .cm-f{all:unset;cursor:pointer;box-sizing:border-box;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--muted);min-height:20px}
  .cm-f[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cm-f:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cm-search{box-sizing:border-box;width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .cm-search:focus-visible,.cm-fld input:focus-visible,.cm-fld select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .cm-back{margin:0 0 12px}
  .cm-fld{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
  .cm-fld label{font-weight:700;font-size:13px;color:var(--ink)}
  .cm-fld input,.cm-fld select{box-sizing:border-box;width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  .cm-hint{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
  .cm-hint.warn{color:var(--warn);font-weight:600}
  .cm-hint.err{color:var(--owed);font-weight:600}
  .cm-pay{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .cm-pay:first-of-type{border-top:none}
  .cm-pay.off .cm-ld{text-decoration:line-through;color:var(--muted)}
  .cm-pay .cm-link{font-size:13px}
  .cm-tag{display:inline-flex;margin-left:6px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#F1EFEA;color:var(--muted)}
  .cm-credit{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:rgba(15,118,110,.08);color:var(--accent-ink);font-size:14px;font-weight:600}
  .cm-acts.col .btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;min-height:40px}
  @media(max-width:820px){.cm-f{padding:10px 14px}}
</style>

<body>
<div id="view" data-page="centre-money">
  <div class="cm-wrap" id="cm">
    <div class="cm-tabs" role="tablist" aria-label="Money">
      <button class="cm-tab" id="cm-tab-run" role="tab" type="button" aria-selected="true" aria-controls="cm-run">Invoice run</button>
      <button class="cm-tab" id="cm-tab-inv" role="tab" type="button" aria-selected="false" aria-controls="cm-inv" tabindex="-1">Invoices &amp; payments</button>
    </div>
    <div class="cm-msg" id="cm-msg" role="status" aria-live="polite"></div>
    <div class="cm-panel" id="cm-run" role="tabpanel" aria-labelledby="cm-tab-run">
      <div class="cm-nav">
        <button class="btn" id="cm-prev" type="button" aria-label="Previous month">&lsaquo;</button>
        <div class="cm-when" id="cm-when" role="status" aria-live="polite">Loading…</div>
        <button class="btn" id="cm-next" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
      <div class="cm-ctx" id="cm-ctx"></div>
      <div id="cm-body"><div class="card cm-block"><p class="cm-note">Loading the invoice run…</p></div></div>
      <div id="cm-num"></div>
    </div>
    <div class="cm-panel" id="cm-inv" role="tabpanel" aria-labelledby="cm-tab-inv" hidden></div>
  </div>

  <!-- invoice sheet -->
  <div class="owe-sheet" id="cm-sheet" role="dialog" aria-modal="true" aria-labelledby="cm-st">
    <div class="owe-panel">
      <div class="owe-grab"></div>
      <div class="owe-head">
        <div class="owe-hl"><div class="owe-title" id="cm-st"></div><div class="owe-meta" id="cm-sm"></div></div>
        <button class="owe-x" id="cm-sx" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="owe-body" id="cm-sb"></div>
    </div>
  </div>
</div>
