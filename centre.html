<script>try{if(localStorage.getItem("td_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
  .cs-wrap{max-width:860px;display:flex;flex-direction:column;gap:14px}
  .cs-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 0 4px;-webkit-overflow-scrolling:touch}
  .cs-tabs::-webkit-scrollbar{display:none}
  .cs-tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:10px 12px;font-weight:700;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
  .cs-tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
  .cs-card{padding:20px 22px;border-radius:16px}
  .cs-card h2{font-size:17px;font-weight:800;margin:0 0 2px}
  .cs-card h3{font-size:14.5px;font-weight:800;margin:18px 0 6px}
  .cs-sub{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.5}
  .cs-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cs-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:600px){.cs-row,.cs-row3{grid-template-columns:1fr;gap:0}}
  .cs-check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 12px;cursor:pointer}
  .cs-check input{width:18px;height:18px;accent-color:var(--accent)}
  .cs-grid{width:100%;border-collapse:collapse;font-size:13.5px}
  .cs-grid th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  .cs-grid td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  .cs-grid input,.cs-grid select{width:100%;min-width:70px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper,#fff);color:var(--ink)}
  .cs-grid select{min-width:118px}
  .cs-grid .num{max-width:96px}
  .cs-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .cs-x{all:unset;cursor:pointer;color:var(--muted);font-size:18px;padding:2px 8px;border-radius:6px}
  .cs-x:hover{background:rgba(180,67,47,.08);color:var(--owed)}
  .cs-add{margin-top:10px}
  .cs-save{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:16px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;box-shadow:0 6px 20px rgba(19,35,63,.08)}
  .cs-save .msg{margin:0;flex:1;text-align:left;min-height:0}
  @media(max-width:820px){.cs-card{padding:18px 16px}.cs-save{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
  .cs-list{display:flex;flex-direction:column;gap:8px}
  .cs-item{all:unset;cursor:pointer;display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .cs-item:hover{border-color:var(--accent)}
  .cs-item b{font-size:14.5px}
  .cs-item p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
  .cs-badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
  .cs-badge.grey{background:var(--bg);color:var(--muted)}
  .cs-preview{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:6px}
  .cs-preview b{font-weight:800}
  .cs-err{color:var(--owed);font-size:13px;margin:6px 0 0}
  .cs-matrix td:first-child{min-width:210px}
  .cs-matrix td{text-align:center}
  .cs-matrix td:first-child,.cs-matrix th:first-child{text-align:left}
  .cs-matrix .grp td{font-weight:800;font-size:12px;color:var(--muted);background:var(--bg);text-align:left}
  .cs-matrix input{width:18px;height:18px;min-width:0;accent-color:var(--accent)}
  .cs-rule{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .cs-rule .k{font-weight:800;font-size:15px}
  .cs-audit{font-size:13px}
  .cs-audit td{vertical-align:top}
  .cs-audit .when{white-space:nowrap;color:var(--muted)}
  /* invoice preview: the centre's own colour is allowed HERE only (it's their document, not TutorDeck's UI) */
  .inv-prev{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;color:#13233F;font-size:13px}
  .inv-prev .bar{height:6px}
  .inv-prev .in{padding:16px 18px}
  .inv-prev h4{margin:0;font-size:18px;font-weight:800}
  .inv-prev table{width:100%;border-collapse:collapse;margin:12px 0}
  .inv-prev td{padding:5px 0;border-bottom:1px solid #EEE}
  .inv-prev td:last-child{text-align:right;white-space:nowrap}
  .inv-prev .tot td{font-weight:800;border-bottom:0}
  .inv-prev .small{color:#5E6676;font-size:12px;white-space:pre-wrap}
  .cs-empty{text-align:center;padding:30px 16px}
  .cs-empty h2{margin-bottom:6px}
</style>
