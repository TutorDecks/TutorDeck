<style>
  .ch-wrap{max-width:820px;display:flex;flex-direction:column;gap:16px}
  .ch-date{font-size:13.5px;color:var(--muted);margin:0}
  .ch-h{font-size:12.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:4px 0 -6px}
  .ch-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  @media(max-width:560px){.ch-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
  .ch-tile{padding:14px 16px;border-radius:14px;display:flex;flex-direction:column;gap:3px}
  a.ch-link{text-decoration:none;color:inherit;cursor:pointer}
  a.ch-link:hover{border-color:var(--accent)}
  a.ch-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ch-tile .n{font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.05}
  .ch-tile .l{font-size:13px;color:var(--muted);line-height:1.35}
  .ch-tile.todo .n{color:var(--warn)}
  .ch-tile.todo.zero .n{color:var(--ink)}
  .ch-tile.zero .l::after{content:" · all clear"}
  .ch-note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
  .ch-soon{padding:22px 22px 20px;border-radius:16px}
  .ch-soon h2{font-size:18px;font-weight:800;margin:0 0 4px}
  .ch-soon p{margin:0 0 10px;font-size:14px;line-height:1.55;color:var(--muted)}
  .ch-soon ul{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.7}
  .ch-pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--bg);color:var(--muted);border:1px solid var(--line);margin-bottom:10px}
  .ch-empty{text-align:center;padding:28px 16px}
  /* tutor changes (T6 step 2): one row per changed lesson; the amber chip is the house warning colour */
  .ch-list{padding:0;overflow:hidden}
  .ch-chg{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .ch-chg:first-child{border-top:none}
  .ch-chg:hover{background:#FBFAF7}
  .ch-chg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .ch-chg-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .ch-chg-t{font-size:14.5px;font-weight:700;color:var(--ink)}
  .ch-chg-d{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch-chg-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .ch-chip{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:rgba(180,83,9,.12);color:#9A4A07;white-space:nowrap}
  .ch-ago{font-size:12px;color:var(--muted)}

</style>
