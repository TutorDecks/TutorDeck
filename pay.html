<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13233F">
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<title>Your invoice</title>
<link rel="stylesheet" href="assets/css/app.css?v=350">
<script>try{if(localStorage.getItem("td_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<style>
  .pv-page{min-height:100dvh;padding:0 0 40px}
  .pv-head{padding:22px 16px;display:flex;justify-content:center}
  .pv-head-in{width:100%;max-width:560px;display:flex;align-items:center;gap:14px}
  .pv-logo{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#fff;flex:none}
  .pv-centre{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
  .pv-main{max-width:560px;margin:-8px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:14px}
  .pv-card{padding:20px}
  .pv-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .pv-h{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
  .pv-sub{font-size:14px;color:var(--muted);margin:2px 0 0}
  .pv-chip{flex:none;display:inline-flex;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;background:#F1EFEA;color:var(--muted)}
  .pv-chip.ok{background:rgba(15,118,110,.12);color:var(--accent-ink)}
  .pv-chip.warn{background:rgba(180,83,9,.12);color:var(--warn)}
  .pv-chip.bad{background:rgba(180,67,47,.12);color:var(--owed)}
  .pv-facts{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0 4px;font-size:14px}
  .pv-facts div{display:flex;flex-direction:column;gap:2px}
  .pv-facts span:first-child{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .pv-ln{display:flex;gap:12px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .pv-ln:first-child{border-top:none}
  .pv-ld{min-width:0;overflow-wrap:anywhere}
  .pv-ld small{display:block;color:var(--muted);font-size:12.5px}
  .pv-la{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
  .pv-tot{border-top:2px solid var(--line);margin-top:6px;padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
  .pv-tot div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
  .pv-tot .due{font-size:20px;font-weight:800;color:var(--ink)}
  .pv-pay{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .pv-qr{width:220px;height:220px;max-width:100%;border-radius:12px;background:#fff;padding:8px;border:1px solid var(--line)}
  .pv-how{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
  .pv-ref{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;text-align:left;margin:4px 0 0}
  .pv-ref dt{color:var(--muted)}
  .pv-ref dd{margin:0;font-weight:700;overflow-wrap:anywhere}
  .pv-done{font-size:15px;font-weight:700;color:var(--accent-ink);margin:0}
  .pv-bad{padding:34px 22px;text-align:center}
  .pv-foot{text-align:center;font-size:12.5px;color:var(--muted);margin:6px 0 0}
</style>
<link rel="stylesheet" href="assets/css/dark.css?v=350">
</head>
<body>
<div class="pv-page">
  <header class="pv-head" id="pv-head"><div class="pv-head-in"><img class="pv-logo" id="pv-logo" alt="" hidden><div class="pv-centre" id="pv-centre">TutorDeck</div></div></header>
  <main class="pv-main" id="pv-main"><div class="card pv-card"><p class="pv-sub" role="status">Loading your invoice…</p></div></main>
  <p class="pv-foot">Sent with TutorDeck</p>
</div>
<script src="assets/vendor/supabase-2.118.0.js"></script>
<script src="assets/js/config.js?v=350"></script>
<script src="assets/js/supabase.js?v=350"></script>
<script src="assets/js/money.js?v=350"></script>
<script src="assets/js/paynow.js?v=350"></script>
<script src="assets/js/qrlib.js?v=350"></script>
<script src="assets/js/pay.js?v=350"></script>
</body>
</html>
