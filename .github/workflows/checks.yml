# Smoke tests on every pull request into dev or main (see tests/smoke.py for what is checked).
# Uses made-up data only: the Supabase library is replaced by tests/supabase-stub-*.js and all
# outside requests are blocked, so no secrets are needed and the real database is never touched.
name: Checks

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04   # pinned: Playwright 1.56 has no browser build for newer Ubuntu yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Unit tests (money maths, settings schema)
        run: node --test tests/money.test.js tests/org-settings.test.js tests/billing-core.test.js tests/billing-api.test.js tests/billing-job.test.js tests/billing-cron.test.js tests/delete-account-api.test.js tests/tutor-core.test.js
      - name: Database tests (organisations, isolation, undo) on a throwaway Postgres
        run: |
          sudo apt-get install -y -q postgresql-16 >/dev/null
          sudo mkdir -p /var/lib/postgresql && sudo chown postgres /var/lib/postgresql
          sudo -u postgres /usr/lib/postgresql/16/bin/initdb -D /var/lib/postgresql/tdtest -A trust -U postgres >/dev/null
          sudo -u postgres /usr/lib/postgresql/16/bin/pg_ctl -D /var/lib/postgresql/tdtest -o "-p 54329 -k /var/lib/postgresql" -l /tmp/pg.log start
          bash tests/sql/run.sh
      - name: Install axe-core (accessibility checker)
        run: npm install --prefix tests --no-audit --no-fund
      - name: Run smoke tests
        run: python3 tests/smoke.py
