<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoices · T-Leng Tuition</title>
<link rel="stylesheet" href="assets/css/app.css?v=143">
</head>
<body>
<div id="view">
  <div class="toolbar" style="flex-wrap:wrap;gap:10px 14px;align-items:center">
    <div class="sub" id="i-count">Loading invoices…</div>
    <div class="inc-filter" style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-left:auto">
      <label style="font-size:12.5px;color:var(--muted);font-weight:600">Paid between</label>
      <input type="date" id="f-from" title="From (paid date)" style="padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px">
      <span style="color:var(--muted)">–</span>
      <input type="date" id="f-to" title="To (paid date)" style="padding:6px 8px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px">
      <button class="btn" id="f-year">This year</button>
      <button class="btn" id="f-clear">All</button>
      <button class="btn" id="i-csv">Export CSV</button>
    </div>
  </div>
  <div class="sub" id="i-income" style="margin:-6px 0 12px;font-weight:600;color:var(--navy)"></div>

  <div class="card">
    <div class="empty" id="i-empty" style="display:none">
      <h3>No saved invoices yet</h3>
      <p>Generate an invoice from the Ledger and tap <b>Save to app</b> to keep a copy here.</p>
    </div>
    <table class="tbl" id="i-table" style="display:none">
      <thead><tr><th>Issued</th><th>Student</th><th>Invoice no.</th><th>Total</th><th>Proof</th><th>Status</th><th></th></tr></thead>
      <tbody id="i-body"></tbody>
    </table>
  </div>
  <input type="file" id="proof-file" accept="image/*" style="display:none">

  <!-- view modal -->
  <div class="modal-backdrop" id="inv-backdrop">
    <div class="modal card wide">
      <div id="inv-body"></div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn" id="inv-close">Close</button>
        <button class="btn btn-primary" id="inv-print">Print / Save PDF</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=143"></script>
<script src="assets/js/supabase.js?v=143"></script>
<script src="assets/js/app.js?v=143"></script>
<script src="assets/js/invoices.js?v=143"></script>
</body>
</html>
