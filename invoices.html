<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Invoices · TutorDeck</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/app.css?v=237">
<style>
  /* ---- v169 Invoices: summary strip, simple filters, list + sheet ---- */
  .iv-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}
  .ls-i{display:flex;flex-direction:column;gap:1px;padding:12px 16px;min-width:0;border-left:1px solid var(--line)}
  .ls-i:first-child{border-left:none}
  .ls-l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .ls-v{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;color:var(--ink)}
  .ls-i.owed .ls-v{color:var(--owed)} .ls-i.paid .ls-v{color:var(--accent)}
  .ls-n{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .iv-seg{margin:0}
  .iv-seg button{padding:8px 15px;font-size:13.5px}
  .iv-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  #iv-period{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:13.5px;color:var(--ink)}
  .dd{position:relative}
  .dd-dots{padding:7px 12px;font-size:16px;line-height:1;letter-spacing:1px}
  .dd-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:40;min-width:170px;background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:0 12px 36px rgba(19,35,63,.16);padding:6px}
  .dd.open .dd-menu{display:block}
  .dd-item{all:unset;cursor:pointer;display:block;padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink)}
  .dd-item:hover{background:var(--cream)}
  .iv-custom{display:none;gap:12px;flex-wrap:wrap;margin:0 0 10px;font-size:13px;color:var(--muted)}
  .iv-custom.on{display:flex}
  .iv-custom input{margin-left:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px}
  .iv-count{font-size:13px;color:var(--muted);margin-bottom:8px}
  .iv-list{padding:0;overflow:hidden}
  .iv-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:13px;width:100%;padding:13px 16px;border-top:1px solid var(--line)}
  .iv-row:first-child{border-top:none}
  .iv-row:hover{background:#F7F6F2}
  .iv-av{width:38px;height:38px;border-radius:19px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .iv-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .iv-name{font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iv-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iv-right2{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .iv-amt{font-weight:800;font-size:15px;color:var(--ink);white-space:nowrap}
  .iv-st{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .iv-st.paid{background:var(--accent-soft);color:var(--accent)}
  .iv-st.wait{background:#FBEFEC;color:var(--owed)}
  .iv-st.unsent{background:#FEF3E2;color:#92400E}
  .iv-st.sent{background:#EEF0F4;color:var(--ink)}
  .iv-st.repl{background:#F1EFEA;color:var(--muted)}
  .iv-row.repl{opacity:.62}
  .iv-row.repl .iv-amt{text-decoration:line-through;color:var(--muted)}
  .ivs-note{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#F1EFEA;color:var(--muted);font-size:13.5px;line-height:1.45}
  .ls-i.warn .ls-v{color:var(--warn)}
  .iv-clip{color:var(--muted);flex:none}
  /* sheet (same pattern as the Ledger's owe sheet) */
  .owe-sheet{position:fixed;inset:0;z-index:70;background:rgba(19,35,63,.38);display:flex;justify-content:flex-end;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
  .owe-sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
  .owe-panel{background:var(--bg);width:min(520px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(19,35,63,.18);transform:translateX(24px);transition:transform .22s ease}
  .owe-sheet.on .owe-panel{transform:none}
  .owe-grab{display:none}
  .owe-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line);background:#fff}
  .owe-hl{flex:1;min-width:0}
  .owe-title{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .owe-meta{font-size:13px;color:var(--muted)}
  .owe-total{font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
  .owe-x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
  .owe-x:hover{background:#F1EFEA;color:var(--ink)}
  .owe-body{flex:1;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
  .owe-body>*{flex-shrink:0}
  .ivs-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ivs-acts .btn{justify-content:center;padding:11px 10px}
  .ivs-acts .wide{grid-column:1/-1}
  .ivs-acts .btn-gold{padding:13px 10px;font-size:15px}
  .ivs-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 14px}
  .ivs-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .ivs-line:first-child{border-top:none}
  .ivs-line .k{color:var(--muted);font-weight:600;font-size:13px}
  .ivs-line input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13.5px}
  .ivs-line .tact{font-size:13.5px;margin-left:12px}
  .ivs-prev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;overflow:hidden}
  .ivs-del{all:unset;cursor:pointer;align-self:center;color:var(--owed);font-weight:700;font-size:13.5px;padding:8px}
  body.sheet-lock{overflow:hidden}
  @media(max-width:820px){
    .ls-i{padding:10px 11px}
    .ls-v{font-size:16px}
    .ls-l{font-size:10px}
    .iv-seg{width:100%;display:flex}
    .iv-seg button{flex:1;text-align:center;padding:9px 4px;font-size:13px;white-space:nowrap}
    .iv-right{margin-left:0;width:100%}
    #iv-period{flex:1}
    .owe-sheet{align-items:flex-end;justify-content:stretch}
    .owe-panel{width:100%;height:auto;max-height:90vh;max-height:90dvh;border-radius:20px 20px 0 0;transform:translateY(30px);box-shadow:0 -10px 40px rgba(19,35,63,.2)}
    .owe-grab{display:block;width:38px;height:4px;border-radius:2px;background:#D6D2C9;margin:8px auto 0}
    .owe-head{border-radius:20px 20px 0 0;padding:10px 18px 12px}
    .ivs-prev{padding:12px;font-size:12px}
  }
</style>
</head>
<body>
<div id="view">
  <div class="iv-sum">
    <div class="ls-i paid"><span class="ls-l">Paid</span><span class="ls-v" id="iv-paid" data-sk>—</span><span class="ls-n" id="iv-paid-n">&nbsp;</span></div>
    <div class="ls-i owed"><span class="ls-l">Awaiting payment</span><span class="ls-v" id="iv-wait" data-sk>—</span><span class="ls-n" id="iv-wait-n">&nbsp;</span></div>
    <div class="ls-i warn"><span class="ls-l">Not sent yet</span><span class="ls-v" id="iv-unsent" data-sk>—</span><span class="ls-n" id="iv-unsent-n">&nbsp;</span></div>
  </div>

  <div class="iv-bar">
    <div class="seg iv-seg" id="iv-seg" role="group" aria-label="Show">
      <button data-st="" class="on">All</button>
      <button data-st="unsent">Not sent<span class="seg-n" id="iv-unsent-c"></span></button>
      <button data-st="issued">Awaiting<span class="seg-n" id="iv-wait-c"></span></button>
      <button data-st="paid">Paid</button>
    </div>
    <div class="iv-right">
      <select id="iv-period" aria-label="Period">
        <option value="year">This year</option>
        <option value="lastyear">Last year</option>
        <option value="all" selected>All time</option>
        <option value="custom">Custom dates…</option>
      </select>
      <div class="dd" id="iv-more">
        <button class="btn dd-dots" type="button" aria-label="More actions" aria-haspopup="true">⋯</button>
        <div class="dd-menu right" role="menu"><button class="dd-item" id="i-csv">Export CSV</button></div>
      </div>
    </div>
  </div>
  <div class="iv-custom" id="iv-custom">
    <label>Paid from <input type="date" id="f-from"></label>
    <label>to <input type="date" id="f-to"></label>
  </div>
  <div class="sub iv-count" id="i-count" data-sk>Loading invoices…</div>

  <div class="card iv-list" id="iv-list"><div style="padding:14px 16px"><div class="sk-rows" aria-hidden="true"><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1"></span><span class="sk sk-l2"></span></span></div><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1 w2"></span><span class="sk sk-l2"></span></span></div><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1"></span><span class="sk sk-l2"></span></span></div></div></div></div>
  <div class="card empty" id="i-empty" style="display:none">
    <h3>No saved invoices yet</h3>
    <p>Generate an invoice from the Ledger and tap <b>Save to app</b> to keep a copy here.</p>
  </div>
  <input type="file" id="proof-file" accept="image/*" style="display:none">

  <!-- tap an invoice → sheet (bottom sheet on phones, side panel on desktop) -->
  <div class="owe-sheet" id="iv-sheet" role="dialog" aria-modal="true" aria-labelledby="iv-s-name">
    <div class="owe-panel">
      <div class="owe-grab" aria-hidden="true"></div>
      <div class="owe-head">
        <div class="owe-hl"><div class="owe-title" id="iv-s-name"></div><div class="owe-meta" id="iv-s-meta"></div></div>
        <div class="owe-total" id="iv-s-amt"></div>
        <button class="owe-x" id="iv-s-close" type="button" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="owe-body" id="iv-s-body"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=237"></script>
<script src="assets/js/supabase.js?v=237"></script>
<script src="assets/js/app.js?v=237"></script>
<script src="assets/js/invoices.js?v=237"></script>
</body>
</html>
