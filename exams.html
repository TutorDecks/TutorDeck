<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exams · TutorDeck</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/app.css?v=219">
<style>
  /* ---- v178 redesign: list rows + detail sheet ---- */
  .owe-sheet{position:fixed;inset:0;z-index:70;background:rgba(19,35,63,.38);display:flex;justify-content:flex-end;
    opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
  .owe-sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
  .owe-panel{background:var(--bg);width:min(480px,100%);height:100%;display:flex;flex-direction:column;
    box-shadow:-12px 0 40px rgba(19,35,63,.18);transform:translateX(24px);transition:transform .22s ease}
  .owe-sheet.on .owe-panel{transform:none}
  .owe-grab{display:none}
  .owe-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line);background:#fff}
  .owe-hl{flex:1;min-width:0}
  .owe-title{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .owe-meta{font-size:13px;color:var(--muted)}
  .owe-total{font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--owed);white-space:nowrap}
  .owe-x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
  .owe-x:hover{background:#F1EFEA;color:var(--ink)}
  .owe-body{flex:1;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  body.sheet-lock{overflow:hidden}
  @media(max-width:820px){
    .owe-sheet{align-items:flex-end;justify-content:stretch}
    .owe-panel{width:100%;height:auto;max-height:88vh;max-height:88dvh;border-radius:20px 20px 0 0;transform:translateY(30px);
      box-shadow:0 -10px 40px rgba(19,35,63,.2)}
    .owe-grab{display:block;width:38px;height:4px;border-radius:2px;background:#D6D2C9;margin:8px auto 0}
    .owe-head{border-radius:20px 20px 0 0;padding:10px 18px 12px}
  }
  .ex-sum{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
  .ex-sum b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .ex-add{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px;border-radius:10px}
  .ex-list{display:flex;flex-direction:column;padding:0;overflow:hidden}
  .ex-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border-top:1px solid var(--line);transition:background-color 1.4s ease}
  .ex-row:first-child{border-top:none}
  .ex-row:hover{background:#FBFAF7}
  .ex-row.ex-hl{background:var(--accent-soft)}
  .ex-date{flex:0 0 44px;text-align:center;line-height:1.1}
  .ex-date b{display:block;font-size:18px;font-weight:800;color:var(--ink)}
  .ex-date small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .ex-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .ex-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-right{flex:none;text-align:right;font-size:13px;font-weight:700;color:var(--muted)}
  .ex-right.soon{color:var(--warn)}
  .ex-right.score{color:var(--ink);font-size:14px}
  .ex-right .pct{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
  .ex-right.add{color:var(--accent)}
  .ex-chev{flex:none;color:#B9BDC6}
  .ex-emp{padding:22px 16px;color:var(--muted);font-size:14px}
  .rd-list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px}
  .rd-row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .rd-row:last-child{border-bottom:none}
  .rd-k{color:var(--muted);font-size:13.5px;font-weight:600;flex:none}
  .rd-v{text-align:right;font-size:14.5px;color:var(--ink)}
  .rd-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
  .rd-acts .btn{justify-content:center;text-align:center;padding:12px 10px;border-radius:10px;font-size:14px;background:#fff;text-decoration:none}
  .rd-acts .rd-primary{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;padding:13px 10px;font-size:15px}
  .rd-acts .rd-del{grid-column:1/-1;background:transparent;border-color:transparent;color:var(--owed);font-weight:700}
  .owe-total.soon{color:var(--warn)} .owe-total.plain{color:var(--ink)}
  @media(max-width:820px){ .ex-add span{display:none} .ex-add{width:42px;padding:0;justify-content:center} }
</style>
</head>
<body>
<div id="view">
  <div class="toolbar">
    <div class="ex-sum" id="x-count" data-sk>Loading exams…</div>
    <button class="btn btn-gold ex-add" id="add-btn" data-fab="Add exam"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add exam</span></button>
  </div>
  <div class="section-title">Upcoming <span class="hint" id="up-hint"></span></div>
  <div class="card ex-list" id="up-list"><div style="padding:14px 16px"><div class="sk-rows" aria-hidden="true"><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1"></span><span class="sk sk-l2"></span></span></div><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1 w2"></span><span class="sk sk-l2"></span></span></div><div class="sk-row"><span class="sk sk-time"></span><span class="sk-lines"><span class="sk sk-l1"></span><span class="sk sk-l2"></span></span></div></div></div></div>
  <div class="section-title" id="past-title" style="display:none">Past</div>
  <div class="card ex-list" id="past-list" style="display:none"></div>

  <!-- exam detail sheet -->
  <div class="owe-sheet" id="ex-sheet" role="dialog" aria-modal="true" aria-labelledby="xs-title">
    <div class="owe-panel">
      <div class="owe-grab"></div>
      <div class="owe-head">
        <div class="owe-hl"><div class="owe-title" id="xs-title"></div><div class="owe-meta" id="xs-sub"></div></div>
        <div class="owe-total" id="xs-right"></div>
        <button class="owe-x" id="xs-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="owe-body"><div id="xs-body"></div><div class="rd-acts" id="xs-acts"></div></div>
    </div>
  </div>

  <!-- add / edit modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal card">
      <h2 id="m-title">Add exam</h2>
      <div class="field"><label for="m-student">Student</label><select id="m-student" data-req></select></div>
      <div class="row2">
        <div class="field"><label for="m-date">Exam date</label><input id="m-date" data-req type="date"></div>
        <div class="field"><label for="m-type">Type <span class="opt">Optional</span></label>
          <input id="m-type" list="type-list" type="text" placeholder="e.g. WA1, Prelim">
          <datalist id="type-list">
            <option value="WA1"><option value="WA2"><option value="WA3">
            <option value="SA1"><option value="SA2"><option value="CA1"><option value="CA2">
            <option value="Mid-Year"><option value="End-Year"><option value="Prelim">
            <option value="PSLE"><option value="N-Level"><option value="O-Level"><option value="A-Level">
            <option value="Class Test"><option value="Common Test">
          </datalist>
        </div>
      </div>
      <div class="field"><label for="m-subject">Subject <span class="opt">Optional</span></label><input id="m-subject" type="text" placeholder="e.g. A-Math"></div>
      <div class="field"><label for="m-topics">Topics tested <span class="opt">Optional</span></label><input id="m-topics" type="text" placeholder="e.g. Quadratics, Indices">
        <span class="fhint">Shown on Home before their lessons, so you know what to revise.</span></div>
      <details class="more-fields">
        <summary>Results <small>Add after the exam</small></summary>
        <div class="more-body">
          <div class="field"><label for="m-score">Marks <span class="opt">Optional</span></label>
            <div style="display:flex;align-items:center;gap:8px">
              <input id="m-score" type="number" min="0" step="0.5" placeholder="Score" style="flex:1;min-width:0">
              <span class="muted" style="font-weight:800">/</span>
              <input id="m-maxscore" type="number" min="1" step="0.5" placeholder="Out of" style="flex:1;min-width:0">
            </div>
            <span class="fhint">Results build the progress chart on the student's profile.</span>
          </div>
          <div class="field"><label for="m-remarks">Remarks <span class="opt">Optional</span></label><input id="m-remarks" type="text" placeholder="e.g. careless in Paper 2"></div>
        </div>
      </details>
      <div class="msg" id="m-msg"></div>
      <div class="modal-actions">
        <button class="btn" id="m-cancel">Cancel</button>
        <button class="btn btn-gold" id="m-save">Save exam</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=219"></script>
<script src="assets/js/supabase.js?v=219"></script>
<script src="assets/js/app.js?v=219"></script>
<script src="assets/js/exams.js?v=219"></script>
</body>
</html>
