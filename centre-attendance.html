<style>
  .ca-wrap{max-width:820px;display:flex;flex-direction:column;gap:14px}
  .ca-nav{display:flex;align-items:center;gap:8px}
  .ca-nav .btn{min-height:42px;padding:0 14px}
  .ca-when{flex:1;min-width:0;text-align:center;font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.01em}
  .ca-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ca-seg{margin:0}
  .ca-seg button{padding:9px 14px;font-size:13.5px;white-space:nowrap}
  .ca-ctl .ca-view{margin-left:auto}
  .ca-tutor{flex:1 1 150px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  .ca-tutor:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
  .ca-count{font-size:13px;color:var(--muted);min-height:18px}
  .ca-day{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:6px 2px 6px}
  .ca-list{display:flex;flex-direction:column;padding:0;overflow:hidden;margin:0 0 8px}
  .ca-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-top:1px solid var(--line)}
  .ca-row:first-child{border-top:none}
  .ca-row:hover{background:#FBFAF7}
  .ca-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .ca-time{flex:none;width:74px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.25}
  .ca-time span{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .ca-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .ca-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ca-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ca-sub.none{color:var(--warn)}
  .ca-chip{flex:none;display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#F1EFEA;color:var(--muted);white-space:nowrap}
  .ca-chip.ok{background:rgba(15,118,110,.12);color:var(--accent-ink)}
  .ca-chip.warn{background:rgba(180,83,9,.12);color:var(--warn)}
  .ca-chev{flex:none;color:#B9BDC6}
  .ca-empty{padding:34px 20px;text-align:center;color:var(--muted)}
  .ca-empty h3{color:var(--ink);font-size:17px;margin:0 0 6px}
  .ca-empty p{margin:0;font-size:14px;line-height:1.5}
  .ca-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
  .ca-pager .btn[disabled]{opacity:.45;cursor:default}
  .ca-note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
  .ca-block{padding:28px 20px;text-align:center}
  /* ---- the lesson sheet (same component as My lessons / Exams) ---- */
  .owe-sheet{position:fixed;inset:0;z-index:70;background:rgba(19,35,63,.38);display:flex;justify-content:flex-end;
    opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
  .owe-sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
  .owe-panel{background:var(--bg);width:min(480px,100%);height:100%;display:flex;flex-direction:column;
    box-shadow:-12px 0 40px rgba(19,35,63,.18);transform:translateX(24px);transition:transform .22s ease}
  .owe-sheet.on .owe-panel{transform:none}
  .owe-grab{display:none}
  .owe-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line);background:#fff}
  .owe-hl{flex:1;min-width:0}
  .owe-title{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .owe-meta{font-size:13px;color:var(--muted)}
  .owe-x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
  .owe-x:hover{background:#F1EFEA;color:var(--ink)}
  .owe-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .owe-body{flex:1;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  body.sheet-lock{overflow:hidden}
  @media(max-width:820px){
    .owe-sheet{align-items:flex-end;justify-content:stretch}
    .owe-panel{width:100%;height:auto;max-height:88vh;max-height:88dvh;border-radius:20px 20px 0 0;transform:translateY(30px);box-shadow:0 -10px 40px rgba(19,35,63,.2)}
    .owe-grab{display:block;width:38px;height:4px;border-radius:2px;background:#D6D2C9;margin:8px auto 0}
    .owe-head{border-radius:20px 20px 0 0;padding:10px 18px 12px}
  }
  .ca-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .ca-h:first-child{margin-top:2px}
  .ca-facts{display:flex;flex-direction:column;gap:6px;margin:0;font-size:14px}
  .ca-facts div{display:flex;gap:10px}
  .ca-facts span:first-child{flex:0 0 92px;color:var(--muted)}
  .ca-facts span:last-child{min-width:0;overflow-wrap:anywhere}
  .ca-marks{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .ca-marks .btn{width:100%;min-height:48px;justify-content:center}
  .ca-pend{margin:10px 0 0;font-size:13px;color:var(--warn)}
  .ca-ro{margin:14px 0 0;font-size:14px;line-height:1.5;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .ca-err{color:var(--owed);font-size:13px;margin:8px 0 0}
  .field textarea{width:100%;min-height:68px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);resize:vertical;box-sizing:border-box}
  .field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
  .ca-opts{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;border:0;padding:0}
  .ca-opts legend{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;padding:0}
  .ca-opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;min-height:44px}
  .ca-opt input{width:18px;height:18px;accent-color:var(--accent);margin:0}
</style>
<link rel="stylesheet" href="assets/css/dark.css?v=285">
</head>
<body>
<div id="view" data-page="centre-attendance">
  <div class="ca-wrap" id="ca">
    <div class="ca-nav">
      <button class="btn" id="ca-prev" type="button" aria-label="Previous">&lsaquo;</button>
      <div class="ca-when" id="ca-when" role="status" aria-live="polite">Loading…</div>
      <button class="btn" id="ca-next" type="button" aria-label="Next">&rsaquo;</button>
    </div>
    <div class="ca-ctl">
      <div class="seg ca-seg ca-view" id="ca-view" role="group" aria-label="Period">
        <button type="button" data-v="day" class="on" aria-pressed="true">Day</button>
        <button type="button" data-v="week" aria-pressed="false">Week</button>
      </div>
      <button class="btn" id="ca-today" type="button">Today</button>
    </div>
    <div class="ca-ctl">
      <div class="seg ca-seg" id="ca-seg" role="group" aria-label="Show"></div>
      <label class="sr-only" for="ca-tutor">Tutor</label>
      <select class="ca-tutor" id="ca-tutor" aria-label="Tutor"><option value="">All tutors</option></select>
    </div>
    <div class="ca-count" id="ca-count" role="status" aria-live="polite">Loading lessons…</div>
    <div id="ca-list"></div>
    <div class="ca-pager" id="ca-pager" hidden>
      <button class="btn" id="ca-pp" type="button">Previous</button>
      <span id="ca-pl"></span>
      <button class="btn" id="ca-pn" type="button">Next</button>
    </div>
  </div>

  <!-- lesson sheet -->
  <div class="owe-sheet" id="ca-sheet" role="dialog" aria-modal="true" aria-labelledby="ca-st">
    <div class="owe-panel">
      <div class="owe-grab"></div>
      <div class="owe-head">
        <div class="owe-hl"><div class="owe-title" id="ca-st"></div><div class="owe-meta" id="ca-sm"></div></div>
        <button class="owe-x" id="ca-sx" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="owe-body" id="ca-sb"></div>
    </div>
  </div>

  <!-- correct a mark -->
  <div class="modal-backdrop" id="ca-cor" role="dialog" aria-modal="true" aria-labelledby="cc-title">
    <div class="modal card">
      <h2 id="cc-title">Correct the mark</h2>
      <p class="ca-note" id="cc-text" style="margin:0 0 14px"></p>
      <fieldset class="ca-opts" id="cc-opts"><legend>Change it to</legend></fieldset>
      <div class="field">
        <label for="cc-reason">Why are you changing it?</label>
        <textarea id="cc-reason" maxlength="500" placeholder="e.g. Parent confirmed the lesson took place"></textarea>
        <span class="fhint">Required. It is kept on the centre&rsquo;s record with your name.</span>
      </div>
      <div class="msg err" id="cc-msg" role="alert"></div>
      <div class="modal-actions">
        <button class="btn" id="cc-cancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="cc-save" type="button">Save correction</button>
      </div>
    </div>
  </div>
</div>
