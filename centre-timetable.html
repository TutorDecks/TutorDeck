<style>
  .tt-wrap{max-width:820px;display:flex;flex-direction:column;gap:14px}
  .tt-nav{display:flex;align-items:center;gap:8px}
  .tt-nav .btn{min-height:42px;padding:0 14px}
  .tt-when{flex:1;min-width:0;text-align:center;font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.01em}
  .tt-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tt-seg{margin:0}
  .tt-seg button{padding:9px 14px;font-size:13.5px;white-space:nowrap}
  .tt-ctl .tt-view{margin-right:auto}
  .tt-sel{flex:1 1 150px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  .tt-sel:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
  .tt-find{flex:1 1 100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
  .tt-find:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
  .tt-pill{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink)}
  .tt-pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tt-pill[aria-pressed="true"]{background:rgba(180,83,9,.12);border-color:rgba(180,83,9,.4);color:var(--warn)}
  .tt-pill .n{font-weight:800}
  .tt-clear{all:unset;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;padding:6px}
  .tt-clear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tt-count{font-size:13px;color:var(--muted);min-height:18px}
  .tt-day{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:8px 2px 6px}
  .tt-day.today{color:var(--accent-ink)}
  .tt-day span:last-child{font-weight:600;letter-spacing:0;text-transform:none}
  .tt-band{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:9px 14px;border-radius:12px;background:#ECEAE4;color:#5B6372;font-size:13.5px;font-weight:700}
  .tt-band svg{flex:none}
  .tt-none{margin:0 2px 8px;font-size:13.5px;color:var(--muted)}
  .tt-list{display:flex;flex-direction:column;padding:0;overflow:hidden;margin:0 0 8px}
  .tt-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-top:1px solid var(--line);border-left:4px solid transparent}
  .tt-row:first-child{border-top:none}
  .tt-row:hover{background:#FBFAF7}
  .tt-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tt-row.notutor{border-left-color:var(--warn);background:rgba(180,83,9,.06)}
  .tt-row.notutor:hover{background:rgba(180,83,9,.1)}
  .tt-row.off .tt-name{text-decoration:line-through;color:var(--muted)}
  .tt-time{flex:none;width:74px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.25}
  .tt-time span{display:block;font-weight:500;color:var(--muted);font-size:12px}
  .tt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .tt-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-sub.none{color:var(--warn);font-weight:700}
  .tt-chips{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .tt-chip{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#F1EFEA;color:var(--muted);white-space:nowrap}
  .tt-chip.ok{background:rgba(15,118,110,.12);color:var(--accent-ink)}
  .tt-chip.warn{background:rgba(180,83,9,.12);color:var(--warn)}
  .tt-chip.trial{background:rgba(19,35,63,.08);color:var(--ink)}
  .tt-chev{flex:none;color:#B9BDC6}
  .tt-empty{padding:34px 20px;text-align:center;color:var(--muted)}
  .tt-empty h3{color:var(--ink);font-size:17px;margin:0 0 6px}
  .tt-empty p{margin:0;font-size:14px;line-height:1.5}
  .tt-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
  .tt-pager .btn[disabled]{opacity:.45;cursor:default}
  .tt-note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
  .tt-block{padding:28px 20px;text-align:center}
  .tt-wrap[hidden],.tt-pager[hidden],.tt-find[hidden],.tt-sel[hidden],.tt-clear[hidden]{display:none}
  /* ---- the lesson sheet (same component as My lessons / Attendance) ---- */
  .owe-sheet{position:fixed;inset:0;z-index:70;background:rgba(19,35,63,.38);display:flex;justify-content:flex-end;
    opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
  .owe-sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
  .owe-panel{background:var(--bg);width:min(480px,100%);height:100%;display:flex;flex-direction:column;
    box-shadow:-12px 0 40px rgba(19,35,63,.18);transform:translateX(24px);transition:transform .22s ease}
  .owe-sheet.on .owe-panel{transform:none}
  .owe-grab{display:none}
  .owe-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line);background:#fff}
  .owe-hl{flex:1;min-width:0}
  .owe-title{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .owe-meta{font-size:13px;color:var(--muted)}
  .owe-x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
  .owe-x:hover{background:#F1EFEA;color:var(--ink)}
  .owe-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .owe-body{flex:1;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  body.sheet-lock{overflow:hidden}
  @media(max-width:820px){
    .owe-sheet{align-items:flex-end;justify-content:stretch}
    .owe-panel{width:100%;height:auto;max-height:88vh;max-height:88dvh;border-radius:20px 20px 0 0;transform:translateY(30px);box-shadow:0 -10px 40px rgba(19,35,63,.2)}
    .owe-grab{display:block;width:38px;height:4px;border-radius:2px;background:#D6D2C9;margin:8px auto 0}
    .owe-head{border-radius:20px 20px 0 0;padding:10px 18px 12px}
  }
  .tt-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
  .tt-facts{display:flex;flex-direction:column;gap:8px;margin:0;font-size:14px}
  .tt-facts div{display:flex;gap:10px}
  .tt-facts span:first-child{flex:0 0 96px;color:var(--muted)}
  .tt-facts span:last-child{min-width:0;overflow-wrap:anywhere}
  .tt-facts .warn{color:var(--warn);font-weight:700}
  .tt-acts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .tt-acts .btn{width:100%;min-height:48px;justify-content:center}
  .tt-ro{margin:14px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted)}
</style>

<body>
<div id="view" data-page="centre-timetable">
  <div class="tt-wrap" id="tt">
    <div class="tt-nav">
      <button class="btn" id="tt-prev" type="button" aria-label="Previous">&lsaquo;</button>
      <div class="tt-when" id="tt-when" role="status" aria-live="polite">Loading…</div>
      <button class="btn" id="tt-next" type="button" aria-label="Next">&rsaquo;</button>
    </div>
    <div class="tt-ctl">
      <div class="seg tt-seg tt-view" id="tt-view" role="group" aria-label="Period">
        <button type="button" data-v="day" aria-pressed="false">Day</button>
        <button type="button" data-v="week" class="on" aria-pressed="true">Week</button>
        <button type="button" data-v="next14" aria-pressed="false">14 days</button>
      </div>
      <button class="btn" id="tt-today" type="button">Today</button>
    </div>
    <div class="tt-ctl" id="tt-filters">
      <label class="sr-only" for="tt-tutor">Tutor</label>
      <select class="tt-sel" id="tt-tutor" aria-label="Tutor"><option value="">All tutors</option></select>
      <label class="sr-only" for="tt-find">Find a student</label>
      <input class="tt-find" id="tt-find" type="search" placeholder="Find a student" autocomplete="off" hidden>
      <label class="sr-only" for="tt-student">Student</label>
      <select class="tt-sel" id="tt-student" aria-label="Student"><option value="">All students</option></select>
      <label class="sr-only" for="tt-branch">Holidays for</label>
      <select class="tt-sel" id="tt-branch" aria-label="Holidays for" hidden><option value="">Holidays: all branches</option></select>
    </div>
    <div class="tt-ctl">
      <button class="tt-pill" id="tt-notutor" type="button" aria-pressed="false">No tutor <span class="n" id="tt-nn">0</span></button>
      <button class="tt-clear" id="tt-clear" type="button" hidden>Clear filters</button>
    </div>
    <div class="tt-count" id="tt-count" role="status" aria-live="polite">Loading lessons…</div>
    <div id="tt-list"></div>
    <div class="tt-pager" id="tt-pager" hidden>
      <button class="btn" id="tt-pp" type="button">Previous</button>
      <span id="tt-pl"></span>
      <button class="btn" id="tt-pn" type="button">Next</button>
    </div>
  </div>

  <!-- lesson sheet (read only) -->
  <div class="owe-sheet" id="tt-sheet" role="dialog" aria-modal="true" aria-labelledby="tt-st">
    <div class="owe-panel">
      <div class="owe-grab"></div>
      <div class="owe-head">
        <div class="owe-hl"><div class="owe-title" id="tt-st"></div><div class="owe-meta" id="tt-sm"></div></div>
        <button class="owe-x" id="tt-sx" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="owe-body" id="tt-sb"></div>
    </div>
  </div>
</div>
