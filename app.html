<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · TutorDeck</title>
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/app.css?v=153">
<style>
  #onboard{display:none;margin-bottom:20px}
  .ob-card{background:linear-gradient(180deg,#FFFFFF,#EEF6F4);border:1px solid var(--gold);
    border-radius:14px;padding:20px 22px;box-shadow:var(--shadow)}
  .ob-h{font-family:var(--serif,Georgia);font-size:18px;color:var(--navy);margin:0 0 3px}
  .ob-sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
  .ob-step{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-top:1px solid rgba(15,118,110,.25)}
  .ob-num{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;background:var(--navy);color:#fff}
  .ob-step.done .ob-num{background:var(--teal)}
  .ob-step.done .ob-t{color:var(--muted);text-decoration:line-through}
  .ob-body{flex:1;min-width:0}
  .ob-t{display:block;font-weight:700;font-size:14.5px;color:var(--ink)}
  .ob-d{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .ob-step .btn{flex:0 0 auto;align-self:center;padding:7px 14px;font-size:13px}
  @media(max-width:520px){ .ob-step{flex-wrap:wrap} .ob-step .btn{margin-left:42px} }
  .dmonth{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .dmonth .gennav{padding:7px 12px;font-weight:700}
  .dm-lbl{min-width:150px;text-align:center;font-weight:700;font-size:14.5px;color:var(--navy)}
  .teach-sec{margin-bottom:16px}
  .teach-sec h2{margin-bottom:2px}
  .teach-sub{color:var(--muted);font-size:13px;margin-bottom:6px}
  .teach-row{display:flex;gap:13px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
  .teach-row:first-child{border-top:1px solid var(--line)}
  .tr-time{flex:0 0 auto;min-width:52px;text-align:center;background:var(--cream);border:1px solid var(--line);color:var(--navy);font-weight:800;font-size:12.5px;border-radius:8px;padding:6px 8px}
  .tr-body{flex:1;min-width:0}
  .tr-head{display:flex;align-items:center;gap:10px}
  .tr-name{flex:1;min-width:0;font-weight:800;font-size:15px;color:var(--navy);display:flex;align-items:center;flex-wrap:wrap}
  .tr-name-row{display:flex;align-items:flex-start;gap:10px}
  .tnote{all:unset;cursor:pointer;flex:0 0 auto;font-size:12px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:5px 12px;background:#fff}
  .tnote:hover{background:var(--cream)}
  .tnote.has{color:var(--teal);border-color:var(--teal)}
  .tr-subj{color:var(--gold);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;margin-left:7px}
  .miss-day{display:flex;align-items:baseline;gap:8px;font-weight:800;color:var(--navy);font-size:13px;margin:12px 0 6px}
  .miss-day:first-child{margin-top:2px}
  .miss-day span{color:var(--muted);font-weight:600;font-size:11.5px}
  .tr-when{color:var(--muted);font-size:11.5px;font-weight:700;margin-bottom:3px}
  .tr-note{font-size:13px;line-height:1.55;margin-top:1px}
  .tr-note b{color:var(--navy)}
  .tr-recap.prev{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);opacity:.9}
  .tr-cols{display:flex;gap:12px;align-items:stretch;margin-top:9px;flex-wrap:wrap;min-width:0}
  .tr-notes{flex:1 1 220px;min-width:0;max-width:100%;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px 12px;overflow-wrap:anywhere}
  .tr-exams{flex:0 1 250px;min-width:0;max-width:100%;background:rgba(180,67,47,.06);border:1px solid rgba(180,67,47,.25);border-radius:10px;padding:9px 12px}
  .tr-exh{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--owed);margin-bottom:5px}
  .exchip{display:block;padding:5px 0;border-top:1px solid rgba(180,67,47,.15);color:inherit;text-decoration:none;cursor:pointer;border-radius:4px}
  .exchip:hover{background:rgba(180,67,47,.06)}
  .exchip:first-of-type{border-top:none;padding-top:0}
  .exchip .ex-l{font-weight:700;color:var(--navy);font-size:12.5px}
  .exchip .ex-m{font-weight:700;color:var(--owed);font-size:11px;margin-left:2px}
  .exchip .ex-d{color:var(--muted);font-size:11px;display:block}
  .exchip .ex-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.35}
  .tr-empty{color:var(--muted);font-size:12.5px;font-style:italic;margin-top:4px}
  .tr-notes,.tr-exams{overflow-wrap:anywhere}
  @media (max-width:600px){
    .teach-row{padding:12px}
    .tr-cols{flex-direction:column;gap:9px}
    .tr-notes{min-width:0;width:100%;flex:0 0 auto}
    .tr-exams{width:100%}
  }
  .brk{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
  .brk:first-child{border-top:none}
  .brk .bn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brk .bmeta{color:var(--muted);font-size:11.5px;font-weight:400;margin-top:1px}
  .brk .bv{font-weight:700;white-space:nowrap;text-align:right}
  .brk .bv small{display:block;color:var(--owed);font-weight:600;font-size:11px}
  #fy-tiles .note{font-size:11px}
  .mprog-card{padding:16px 18px}
  .mprog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .mprog-lbl{font-weight:700;font-size:14px;color:var(--navy)}
  .mprog-pct{font-weight:800;font-size:17px;color:var(--teal)}
  .mprog-track{height:12px;background:#ECE9E2;border-radius:7px;overflow:hidden;display:flex}
  .mprog-fill{height:100%;background:var(--teal);transition:width .35s ease}
  .mprog-owed{height:100%;background:var(--owed);transition:width .35s ease}
  .mprog-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--muted)}
  .mprog-legend b{color:var(--ink);font-weight:700}
  .mprog-legend .mdot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .mdot.teal{background:var(--teal)} .mdot.red{background:var(--owed)} .mdot.grey{background:#C9C5BC}
  .mprog-sub{margin-top:8px;color:var(--muted);font-size:12.5px}

  /* ---- Home (v148) ---- */
  .hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .hstat{display:flex;flex-direction:column;gap:2px;padding:13px 15px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:border-color .12s,transform .12s}
  .hstat:hover{border-color:var(--gold)}
  .hstat:active{transform:scale(.98)}
  .hs-l{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .hs-v{font-family:var(--sans);font-weight:800;letter-spacing:-.02em;font-size:23px;line-height:1.15;color:var(--navy)}
  .hstat.owed .hs-v{color:var(--owed)} .hstat.paid .hs-v{color:var(--teal)}
  .hs-n{font-size:12px;color:var(--muted)}
  .home-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
  .home-col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .home-col .teach-sec{margin-bottom:0}
  .h-more{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--gold);text-decoration:none}
  .h-more:hover{text-decoration:underline}
  @media(max-width:980px){ .hstats{grid-template-columns:repeat(2,1fr);gap:10px} }
  @media(max-width:880px){
    .home-grid{display:flex;flex-direction:column;align-items:stretch;gap:14px}
    .home-col{display:contents}
    #today-sec{order:1} #yday-sec{order:2} #tmr-sec{order:3} #exam-sec{order:4} #month-sec{order:5}
    .hs-v{font-size:21px}
  }
</style>
</head>
<body>
<div id="view">
  <div id="onboard"></div>

  <div class="hstats">
    <a class="hstat owed" href="ledger.html"><span class="hs-l">Owed to you</span><span class="hs-v" id="k-pending">—</span><span class="hs-n" id="k-pending-n">&nbsp;</span></a>
    <a class="hstat paid" href="insights.html"><span class="hs-l">Collected</span><span class="hs-v" id="k-collected">—</span><span class="hs-n" id="k-collected-n">&nbsp;</span></a>
    <a class="hstat" href="calendar.html"><span class="hs-l">This week</span><span class="hs-v" id="k-week">—</span><span class="hs-n">lessons</span></a>
    <a class="hstat" href="exams.html"><span class="hs-l">Exams</span><span class="hs-v" id="k-exams">—</span><span class="hs-n">next 14 days</span></a>
  </div>

  <div class="home-grid" id="teach-view">
    <div class="home-col">
      <div class="card panel teach-sec" id="today-sec">
        <h2 id="today-h">Today</h2>
        <div class="teach-sub" id="today-sub"></div>
        <div id="today-list"><div class="muted" style="font-size:13.5px">Loading…</div></div>
      </div>
      <div class="card panel teach-sec" id="tmr-sec">
        <h2 id="tmr-h">Tomorrow</h2>
        <div class="teach-sub" id="tmr-sub"></div>
        <div id="tmr-list"><div class="muted" style="font-size:13.5px">Loading…</div></div>
      </div>
    </div>
    <div class="home-col">
      <div class="card panel teach-sec" id="yday-sec" style="display:none">
        <h2 id="yday-h">Needs notes <span class="hint" id="yday-hint"></span></h2>
        <div class="teach-sub" id="yday-sub"></div>
        <div id="yday-list"></div>
      </div>
      <div class="card panel teach-sec" id="exam-sec">
        <h2>Upcoming exams <a class="h-more" href="exams.html">All</a></h2>
        <div id="teach-exam-list"><div class="muted" style="font-size:13.5px">Loading…</div></div>
      </div>
      <div class="card panel mprog-card" id="month-sec">
        <div class="mprog-top"><span class="mprog-lbl" id="mprog-lbl">This month</span><span class="mprog-pct" id="mprog-pct">—</span></div>
        <div class="mprog-track"><div class="mprog-fill" id="mprog-fill" style="width:0%"></div><div class="mprog-owed" id="mprog-owed" style="width:0%"></div></div>
        <div class="mprog-legend" id="mprog-legend">
          <span><i class="mdot teal"></i>Collected <b id="mprog-c">—</b></span>
          <span><i class="mdot red"></i>Owed <b id="mprog-o">—</b></span>
          <span><i class="mdot grey"></i>Upcoming <b id="mprog-u">—</b></span>
        </div>
        <div class="mprog-sub"><span id="mprog-sub"></span> · <a class="h-more" href="insights.html">See income</a></div>
      </div>
    </div>
  </div>

  <!-- quick lesson-note modal -->
  <div class="modal-backdrop" id="tn-modal">
    <div class="modal card">
      <h2 id="tn-title">Lesson note</h2>
      <p class="muted" id="tn-sub" style="font-size:13px;margin-bottom:14px"></p>
      <div class="field"><label for="tn-topics">Topics covered</label><input id="tn-topics" type="text" placeholder="e.g. Quadratic equations"></div>
      <div class="field"><label for="tn-homework">Homework</label><input id="tn-homework" type="text" placeholder="e.g. Worksheet 3, Q1–10"></div>
      <div class="field"><label for="tn-remarks">Remarks</label><input id="tn-remarks" type="text" placeholder="optional"></div>
      <div class="msg" id="tn-msg"></div>
      <div class="modal-actions">
        <button class="btn" id="tn-cancel">Cancel</button>
        <button class="btn btn-primary" id="tn-save">Save note</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/js/config.js?v=153"></script>
<script src="assets/js/supabase.js?v=153"></script>
<script src="assets/js/app.js?v=153"></script>
<script src="assets/js/dashboard.js?v=153"></script>
</body>
</html>
