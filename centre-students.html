<head>

<style>
  .cs-wrap{max-width:820px;display:flex;flex-direction:column;gap:14px}
  .cs-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .cs-search{flex:1 1 240px;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);box-sizing:border-box}
  .cs-search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
  .cs-seg{margin:0;display:flex;width:100%}
  .cs-seg button{flex:1;text-align:center;padding:9px 6px;font-size:13.5px;white-space:nowrap}
  @media(min-width:821px){.cs-seg{width:auto;display:inline-flex}.cs-seg button{flex:none;padding:9px 18px}}
  .cs-count{font-size:13px;color:var(--muted);min-height:18px}
  .cs-list{display:flex;flex-direction:column;padding:0;overflow:hidden}
  .cs-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:13px;width:100%;padding:12px 16px;border-top:1px solid var(--line)}
  .cs-row:first-child{border-top:none}
  .cs-row:hover{background:#FBFAF7}
  .cs-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .cs-av{flex:none;width:38px;height:38px;border-radius:19px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
  .cs-row.ended .cs-av{background:#F1EFEA;color:var(--muted)}
  .cs-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .cs-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cs-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cs-tags{flex:none;display:flex;gap:6px;align-items:center}
  .cs-chip{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#F1EFEA;color:var(--muted)}
  .cs-chip.lvl{background:var(--accent-soft);color:var(--accent-ink)}
  .cs-chev{flex:none;color:#B9BDC6}
  @media(max-width:520px){.cs-chip.lvl{display:none}}
  .cs-empty{padding:34px 20px;text-align:center;color:var(--muted)}
  .cs-empty h3{color:var(--ink);font-size:17px;margin:0 0 6px}
  .cs-empty p{margin:0;font-size:14px;line-height:1.5}
  .cs-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
  .cs-pager .btn[disabled]{opacity:.45;cursor:default}
  .cs-note{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
  .cs-block{padding:28px 20px;text-align:center}
  /* ---- the student sheet (same component as My lessons / Exams) ---- */
  .owe-sheet{position:fixed;inset:0;z-index:70;background:rgba(19,35,63,.38);display:flex;justify-content:flex-end;
    opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
  .owe-sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
  .owe-panel{background:var(--bg);width:min(480px,100%);height:100%;display:flex;flex-direction:column;
    box-shadow:-12px 0 40px rgba(19,35,63,.18);transform:translateX(24px);transition:transform .22s ease}
  .owe-sheet.on .owe-panel{transform:none}
  .owe-grab{display:none}
  .owe-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line);background:#fff}
  .owe-hl{flex:1;min-width:0}
  .owe-title{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .owe-meta{font-size:13px;color:var(--muted)}
  .owe-x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
  .owe-x:hover{background:#F1EFEA;color:var(--ink)}
  .owe-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .owe-body{flex:1;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  body.sheet-lock{overflow:hidden}
  @media(max-width:820px){
    .owe-sheet{align-items:flex-end;justify-content:stretch}
    .owe-panel{width:100%;height:auto;max-height:88vh;max-height:88dvh;border-radius:20px 20px 0 0;transform:translateY(30px);box-shadow:0 -10px 40px rgba(19,35,63,.2)}
    .owe-grab{display:block;width:38px;height:4px;border-radius:2px;background:#D6D2C9;margin:8px auto 0}
    .owe-head{border-radius:20px 20px 0 0;padding:10px 18px 12px}
  }
  .cs-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
  .cs-h:first-child{margin-top:2px}
  .cs-facts{display:flex;flex-direction:column;gap:6px;margin:0;font-size:14px}
  .cs-facts div{display:flex;gap:10px}
  .cs-facts span:first-child{flex:0 0 98px;color:var(--muted)}
  .cs-facts span:last-child{min-width:0;overflow-wrap:anywhere}
  .cs-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 8px}
  .cs-card b{font-size:14.5px}
  .cs-card .rel{color:var(--muted);font-size:13px;margin-left:6px}
  .cs-card .main{float:right;font-size:11.5px;font-weight:700;color:var(--accent-ink)}
  .cs-card a{display:inline-block;margin-top:3px;font-size:14px;color:var(--accent-ink);font-weight:600;text-decoration:none;min-height:24px}
  .cs-card a:hover{text-decoration:underline}
  .cs-card .line{display:block}
  .cs-links{display:flex;flex-wrap:wrap;gap:8px}
  .cs-link{all:unset;cursor:pointer;box-sizing:border-box;padding:8px 13px;min-height:40px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center}
  .cs-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cs-next{display:flex;flex-direction:column;gap:6px;font-size:14px}
  .cs-next div{display:flex;gap:10px;justify-content:space-between}
  .cs-next .t{color:var(--muted);font-size:13px;white-space:nowrap}
  .cs-acts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .cs-acts .btn{width:100%;min-height:46px;justify-content:center}
  .cs-trial{margin:10px 0 0;font-size:13px;color:var(--muted)}
  /* ---- the add / edit form ---- */
  .cs-g{border:1px solid var(--line);border-radius:12px;padding:12px 12px 2px;margin:0 0 10px;background:var(--bg);position:relative}
  .cs-g .row2{margin-bottom:0}
  .cs-g .field{margin-bottom:10px}
  .cs-g-x{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--owed);padding:6px 4px 10px;min-height:24px}
  .cs-g-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .cs-g-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
  .cs-err{color:var(--owed);font-size:12.5px;margin:-4px 0 8px}
  .cs-fam{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin:0 0 14px;font-size:13.5px}
  .field textarea{width:100%;min-height:68px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);resize:vertical;box-sizing:border-box}
  .field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
</style>
<link rel="stylesheet" href="assets/css/dark.css?v=300">
</head>
<body>
<div id="view" data-page="centre-students">
  <div class="cs-wrap" id="cs">
    <div class="cs-top">
      <input class="cs-search" id="cs-q" type="search" placeholder="Search name, level, parent or phone" aria-label="Search students" autocomplete="off" maxlength="100">
      <button class="btn btn-primary" id="cs-add" type="button" data-fab="Add student">+ Add student</button>
    </div>
    <div class="seg cs-seg" id="cs-seg" role="group" aria-label="Show"></div>
    <div class="cs-count" id="cs-count" role="status" aria-live="polite">Loading students…</div>
    <div class="card cs-list" id="cs-list"></div>
    <div class="cs-pager" id="cs-pager" hidden>
      <button class="btn" id="cs-prev" type="button">Previous</button>
      <span id="cs-pl"></span>
      <button class="btn" id="cs-next" type="button">Next</button>
    </div>
  </div>

  <!-- student sheet -->
  <div class="owe-sheet" id="cs-sheet" role="dialog" aria-modal="true" aria-labelledby="cs-st">
    <div class="owe-panel">
      <div class="owe-grab"></div>
      <div class="owe-head">
        <div class="owe-hl"><div class="owe-title" id="cs-st"></div><div class="owe-meta" id="cs-sm"></div></div>
        <button class="owe-x" id="cs-sx" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="owe-body" id="cs-sb"></div>
    </div>
  </div>

  <!-- add / edit form -->
  <div class="modal-backdrop" id="cs-form" role="dialog" aria-modal="true" aria-labelledby="cf-title">
    <div class="modal card wide">
      <h2 id="cf-title">Add student</h2>
      <div id="cf-fam" class="cs-fam" hidden></div>
      <div class="field">
        <label for="cf-name">Student&rsquo;s name</label>
        <input id="cf-name" type="text" maxlength="120" autocomplete="off" placeholder="e.g. Mei Ling Koh">
        <div class="cs-err" id="cf-name-e" hidden></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="cf-level">Level <span class="opt">Optional</span></label>
          <input id="cf-level" type="text" maxlength="40" placeholder="e.g. Sec 3">
        </div>
        <div class="field" id="cf-hn-f">
          <label for="cf-hn">Family name <span class="opt">Optional</span></label>
          <input id="cf-hn" type="text" maxlength="120" placeholder="e.g. The Koh family">
        </div>
      </div>
      <div id="cf-contacts">
        <div class="cs-h" style="margin-top:4px">Parents and guardians</div>
        <p class="cs-note" style="margin:-2px 0 10px">The first one is the main contact. Each needs a name and a phone number or an email.</p>
        <div id="cf-gs"></div>
        <button class="btn" id="cf-addg" type="button">+ Add another contact</button>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="cf-notes">Notes <span class="opt">Optional</span></label>
        <textarea id="cf-notes" maxlength="1000" placeholder="e.g. prefers worked examples"></textarea>
      </div>
      <div class="msg err" id="cf-msg" role="alert"></div>
      <div class="modal-actions">
        <button class="btn" id="cf-cancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="cf-save" type="button">Save student</button>
      </div>
    </div>
  </div>

  <!-- discontinue -->
  <div class="modal-backdrop" id="cs-end" role="dialog" aria-modal="true" aria-labelledby="ce-title">
    <div class="modal card">
      <h2 id="ce-title">Discontinue student</h2>
      <p class="cs-note" id="ce-text" style="margin:0 0 14px"></p>
      <div class="field">
        <label for="ce-date">Lessons run until</label>
        <input id="ce-date" type="date">
        <span class="fhint">The last day of lessons. After it the student moves to Ended and no new lessons are made. Lessons already on the timetable stay.</span>
      </div>
      <div class="msg err" id="ce-msg" role="alert"></div>
      <div class="modal-actions">
        <button class="btn" id="ce-cancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="ce-save" type="button">Discontinue</button>
      </div>
    </div>
  </div>
</div>
