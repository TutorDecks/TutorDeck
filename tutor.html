<style>
  /* ---- lesson detail sheet (same component as Exams / Ledger) ---- */
  .owe-sheet{position:fixed;inset:0;z-index:70;background:rgba(19,35,63,.38);display:flex;justify-content:flex-end;
    opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
  .owe-sheet.on{opacity:1;visibility:visible;transition:opacity .2s}
  .owe-panel{background:var(--bg);width:min(480px,100%);height:100%;display:flex;flex-direction:column;
    box-shadow:-12px 0 40px rgba(19,35,63,.18);transform:translateX(24px);transition:transform .22s ease}
  .owe-sheet.on .owe-panel{transform:none}
  .owe-grab{display:none}
  .owe-head{display:flex;align-items:center;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--line);background:#fff}
  .owe-hl{flex:1;min-width:0}
  .owe-title{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--ink)}
  .owe-meta{font-size:13px;color:var(--muted)}
  .owe-x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--muted)}
  .owe-x:hover{background:#F1EFEA;color:var(--ink)}
  .owe-body{flex:1;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  body.sheet-lock{overflow:hidden}
  @media(max-width:820px){
    .owe-sheet{align-items:flex-end;justify-content:stretch}
    .owe-panel{width:100%;height:auto;max-height:88vh;max-height:88dvh;border-radius:20px 20px 0 0;transform:translateY(30px);
      box-shadow:0 -10px 40px rgba(19,35,63,.2)}
    .owe-grab{display:block;width:38px;height:4px;border-radius:2px;background:#D6D2C9;margin:8px auto 0}
    .owe-head{border-radius:20px 20px 0 0;padding:10px 18px 12px}
  }
  /* ---- the list ---- */
  .tt-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .tt-set{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:700;color:var(--accent-ink);text-decoration:none}
  .tt-set:hover{text-decoration:underline}
  .tt-sum{display:flex;align-items:baseline;gap:8px;font-size:14px;color:var(--muted)}
  .tt-sum b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .tt-list{display:flex;flex-direction:column;padding:0;overflow:hidden}
  .tt-day{padding:9px 16px 7px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--bg);border-top:1px solid var(--line)}
  .tt-day:first-child{border-top:none}
  .tt-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border-top:1px solid var(--line)}
  .tt-day + .tt-row{border-top:none}
  .tt-row:first-child{border-top:none}
  .tt-row:hover{background:#FBFAF7}
  .tt-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .tt-time{flex:0 0 52px;text-align:center;line-height:1.1}
  .tt-time b{display:block;font-size:17px;font-weight:800;color:var(--ink)}
  .tt-time small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .tt-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tt-chip{flex:none;display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .tt-chip.ok{background:rgba(15,118,110,.12);color:var(--teal)}
  .tt-chip.warn{background:rgba(180,83,9,.10);color:#9A4A07}   /* the house amber, a shade darker so the small badge text passes AA contrast on its tint */
  .tt-chip.muted{background:#F1EFEA;color:var(--muted);font-weight:600}
  .tt-chip.action{background:var(--accent);color:#fff}
  .tt-chev{flex:none;color:#B9BDC6}
  .tt-empty{padding:22px 16px;color:var(--muted);font-size:14px}
  .tt-note{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:#F1EFEA;color:var(--muted);font-size:13.5px}
  /* ---- inside the sheet ---- */
  .tt-facts{display:flex;flex-direction:column;gap:6px;margin:0 0 16px;font-size:14px}
  .tt-facts div{display:flex;gap:10px}
  .tt-facts span:first-child{flex:0 0 84px;color:var(--muted)}
  .tt-facts .due.late{color:var(--warn);font-weight:700}
  .tt-opts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
  .tt-opt{flex:1 1 calc(50% - 5px);min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
  .tt-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  .tt-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tt-lbl{display:block;font-size:13px;font-weight:700;color:var(--ink);margin:0 0 6px}
  .tt-ta{display:block;width:100%;min-height:72px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);resize:vertical;margin:0 0 14px;box-sizing:border-box}
  .tt-ta:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
  .tt-in{display:block;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink);box-sizing:border-box}
  .tt-in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(15,118,110,.18)}
  .tt-hint{margin:6px 0 16px;font-size:12.5px;color:var(--muted)}
  .tt-check{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:14px;font-weight:600;color:var(--ink);min-height:44px}
  .tt-check input{width:20px;height:20px;accent-color:var(--accent)}
  .tt-ro{margin:0 0 14px;font-size:14px;white-space:pre-wrap}
  /* (S7b) your own pay */
  .tt-pay{font-size:12.5px;font-weight:700;color:var(--teal)}
  .tt-pay.pending{color:#9A4A07;font-weight:600}
  .tt-paycard{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;margin:0 0 14px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;text-decoration:none;color:var(--ink)}
  .tt-paycard:hover{background:#FBFAF7}
  .tt-paycard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tt-pc-l{font-size:13px;font-weight:700;color:var(--muted)}
  .tt-pc-l small{font-weight:600}
  .tt-pc-v{font-size:22px;font-weight:800;letter-spacing:-.02em;grid-row:1 / span 2;grid-column:2;align-self:center}
  .tt-pc-n{font-size:12.5px;color:var(--muted)}
  .tt-ro small{display:block;color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:2px}
</style>

<body>
<div id="view" data-page="tutor">
  <div class="tt-top"><div class="tt-sum" id="tt-sum" aria-live="polite">Loading your lessons…</div><a class="tt-set" href="tutor-settings">Profile &amp; password</a></div>
  <div id="tt-pay" style="display:none"></div>
  <div id="tt-lists"></div>

  <!-- lesson sheet -->
  <div class="owe-sheet" id="tt-sheet" role="dialog" aria-modal="true" aria-labelledby="ts-title">
    <div class="owe-panel">
      <div class="owe-grab"></div>
      <div class="owe-head">
        <div class="owe-hl"><div class="owe-title" id="ts-title"></div><div class="owe-meta" id="ts-sub"></div></div>
        <button class="owe-x" id="ts-close" type="button" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="owe-body">
        <div id="ts-body"></div>
        <div class="msg" id="ts-msg" role="status" style="text-align:left"></div>
        <button class="btn btn-primary" id="ts-save" type="button" style="width:100%;min-height:46px">Save</button>
      </div>
    </div>
  </div>
</div>
